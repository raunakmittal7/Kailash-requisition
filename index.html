<style>
/* Layout: quiet white workspace, left rail on wide screens, scrolling tab strip on phones. Colour only for status. Light theme only, by request. */
:root{
  --bg:#ffffff; --soft:#f6f8f7; --ink:#18201c; --muted:#68736d; --line:#e5e9e7;
  --brand:#0e7a5c; --brand-soft:#e7f4ef; --amber:#b86e00; --amber-soft:#fdf3e2;
  --red:#c0352b; --red-soft:#fcebea; --blue:#2858b8; --blue-soft:#eaf0fb;
  --sans:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.9em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.syncbad{color:#b4231b;font-weight:600}
.beta{max-width:1180px;margin:0 auto;padding-block:8px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}

.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding-block:20px 60px}

.timeline .when{color:var(--muted);font-size:.8rem}
.note{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}

.bar{height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.barrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}

/* purchase order document */
.podoc{border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:18px;background:#fff}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}

/* modal and toast */
#modal .ov{position:fixed;inset:0;background:rgba(24,32,28,.25);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.mcard{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.12)}

<script>
/* ---------- basics ---------- */
const H=36e5, D=24*H, KEY='kg-req-beta-v1';
const now=()=>Date.now();
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtDT=ts=>new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const rs=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const nf=n=>(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
function dur(ms){const h=ms/H;if(h<1)return Math.max(1,Math.round(ms/6e4))+' min';if(h<48)return Math.round(h)+' h';return Math.round(h/24)+' days'}
const YEAR=new Date().getFullYear();

const CATS_RE=['Civil and structural','Steel and reinforcement','Electrical','Plumbing and sanitary','Tiles and flooring','Paint and finishing','Doors, windows and hardware','Wood and plywood','Glass and aluminium','Waterproofing and chemicals','Fire safety','Lifts and machinery','Tools and consumables','Safety gear','Shuttering and scaffolding'];
const CATS_MFG=['Raw materials','Packaging','Machinery spares','Electrical','Plumbing and piping','Lab and QC','Cleaning chemicals','Lubricants and fuel','Office and stationery','Grocery & Ration','Others'];

const STAGE={
  ravi_ok:{label:'Ravi approval',short:'Ravi',owner:'ravi'},
  ajay_ok:{label:'Ajay approval',short:'Ajay',owner:'ajay'},
  quotes:{label:'Vendor quotes',short:'Quotes',owner:'pm'},
  final:{label:'Raunak confirms vendors',short:'Raunak',owner:'raunak'},
  issue:{label:'PO to be issued',short:'PO issue',owner:'pm'},
  approved:{label:'PO issued',short:'PO issued'},
  clarify:{label:'Sent back for clarification',short:'Sent back'},
  rejected:{label:'Rejected',short:'Rejected'}
};

/* Hindi -> English (demo word list; the full version uses a translation service) */
const HI={'सीमेंट':'cement','बोरी':'bags','सरिया':'TMT bar','ईंट':'bricks','रेत':'sand','बालू':'sand','गिट्टी':'stone chips','पाइप':'pipe','तार':'wire','बिजली':'electric','पेंट':'paint','टाइल':'tile','टाइल्स':'tiles','दरवाजा':'door','खिड़की':'window','लकड़ी':'wood','प्लाई':'plywood','कील':'nails','सीढ़ी':'ladder','हेलमेट':'helmet','दस्ताने':'gloves','बोतल':'bottle','ढक्कन':'cap','लेबल':'label','चीनी':'sugar','तेल':'oil','डीजल':'diesel','मोटर':'motor','पंखा':'fan','बल्ब':'bulb','स्विच':'switch','नल':'tap','वाल्व':'valve','काला':'black','सफेद':'white','लाल':'red','बड़ा':'large','छोटा':'small','नया':'new','मिमी':'mm','इंच':'inch','फुट':'ft','मीटर':'metre','किलो':'kg','लीटर':'litre','पैकेट':'packets','डिब्बा':'box','और':'and','लिए':'for','चाहिए':'needed','जल्दी':'urgent','पहली':'first','दूसरी':'second','मंजिल':'floor','छत':'roof','दीवार':'wall','प्लास्टर':'plaster','ढलाई':'casting','कांटेदार':'barbed','खंभा':'pole','खंभे':'poles','फावड़ा':'shovel','तसला':'pan','पानी':'water','टंकी':'tank','के':'','की':'','का':'','को':'','में':'in'};
const DEV='०१२३४५६७८९';
function toEn(t){if(!/[ऀ-ॿ]/.test(t||''))return t;return t.replace(/[०-९]/g,d=>DEV.indexOf(d)).split(/\s+/).map(w=>HI[w]??w).filter(Boolean).join(' ')}

/* category guess: history first, then keywords */
const KW_RE=[[/cement|sand|brick|aggregate|chips|block|concrete|barbed|fenc|pole/i,'Civil and structural'],[/tmt|steel|rod|\bbar\b|binding/i,'Steel and reinforcement'],[/wire|cable|switch|mcb|bulb|light|conduit|socket|fan|electric/i,'Electrical'],[/pipe|cpvc|upvc|tap|valve|sanitary|basin|commode|tank/i,'Plumbing and sanitary'],[/tile|granite|marble|floor/i,'Tiles and flooring'],[/paint|putty|primer|emulsion/i,'Paint and finishing'],[/door|window|hinge|lock|handle/i,'Doors, windows and hardware'],[/ply|wood|timber|board|laminate/i,'Wood and plywood'],[/glass|alumin/i,'Glass and aluminium'],[/waterproof|chemical|admix|sealant/i,'Waterproofing and chemicals'],[/fire|extinguish|sprinkler/i,'Fire safety'],[/lift|mixer|vibrator|machine/i,'Lifts and machinery'],[/helmet|glove|shoe|harness|jacket/i,'Safety gear'],[/shutter|scaffold|prop/i,'Shuttering and scaffolding'],[/drill|blade|tool|nail|screw|shovel|pan\b/i,'Tools and consumables']];
const KW_MFG=[[/rice|\bdal\b|atta|flour|\btea\b|grocery|ration|spice|masala|\bsalt\b|mustard oil|edible oil|vegetable|cooking gas|lpg/i,'Grocery & Ration'],[/preform|cap|label|carton|shrink|film|bottle/i,'Packaging'],[/sugar|concentrate|co2|flavou?r|syrup/i,'Raw materials'],[/bearing|belt|seal|spare|gear\b(?! ?(box )?oil)|nozzle/i,'Machinery spares'],[/lab|reagent|test|ph\b/i,'Lab and QC'],[/caustic|cip|sanitiz|detergent/i,'Cleaning chemicals'],[/oil|grease|diesel|lubric/i,'Lubricants and fuel'],[/paper|pen\b|file|stationery/i,'Office and stationery'],[/wire|cable|switch|mcb|motor/i,'Electrical'],[/pipe|valve|tap|fitting/i,'Plumbing and piping']];
function guessCat(name,sc){const n=(name||'').trim().toLowerCase();if(!n)return null;const type=site(sc).type;const h=S.catHistory[type+'|'+n];if(h)return {cat:h,from:'history'};for(const [re,c] of (type==='mfg'?KW_MFG:KW_RE))if(re.test(n)&&catsFor(sc).includes(c))return {cat:c,from:'guess'};return null}

function makePO(r,vendorId,entries,company,at){
  const p={id:uid(),no:nextNo('po',r.site),reqId:r.id,reqNo:r.no,site:r.site,cat:[...new Set(entries.map(e=>e.it.cat))].join(', '),vendorId,company,status:'open',createdAt:at??now(),receipts:[],closeReq:null,closeNote:'',
    awardBy:r.smallOrder?'pm10k':r.pmDecides?'pm':(r.awardBy||'raunak'),issuedBy:'pm',
    lines:entries.map(({it,q})=>({itemId:it.id,name:it.name,brand:q.brand,qty:it.qty,unit:it.unit,subUnit:it.subUnit,rate:+q.rates[it.id]||0,gst:+q.gst||0,received:0}))};
  S.pos.push(p);return p}
const poValue=p=>p.lines.reduce((s,l)=>s+l.qty*l.rate*(1+l.gst/100),0);
const quoteTotal=(its,qt)=>its.reduce((s,it)=>s+(+qt.rates[it.id]||0)*it.qty,0)*(1+(+qt.gst||0)/100);

function stockAdd(sc,name,unit,qty,kind,by,note,cat,at){
  let s=S.stock.find(x=>x.site===sc&&x.name.toLowerCase()===name.toLowerCase());
  if(!s){const n=S.stock.filter(x=>x.site===sc).length+1;s={id:uid(),site:sc,name,unit,qty:0,cat:cat||'',barcode:`${sc}-${String(n).padStart(4,'0')}`};S.stock.push(s)}
  move(s,kind,qty,by,note,at);return s}
function move(s,kind,qty,by,note,at){s.qty+=qty;S.moves.unshift({id:uid(),at:at??now(),by,site:s.site,itemId:s.id,kind,qty:Math.abs(qty),note})}

/* 4-hour auto reminders */
function runReminders(){
  if(!me()||me().role==='store')return;
  S.reqs.filter(isOpen).forEach(r=>{
    const key=r.stage+'@'+r.stageSince;
    if(now()-r.stageSince>4*H&&!r.reminded[key]){
      r.reminded[key]=1;
      send(targets(ownerOf(r),r.site),`Reminder: ${r.no} (${site(r.site).name}) has been waiting with you for over 4 hours. Needed by ${fmtD(r.deadline)}.`,'Auto reminder',r.stageSince+4*H);
    }});
  S.outbox.sort((a,b)=>b.at-a.at);
}

function roleName(u){return u.role==='store'?'Storekeeper, '+(site(u.site)?.name||u.site):u.role==='pm'?'Procurement':u.dbRole==='admin'?'Admin':'Approver'}
function navFor(u){
  if(u.role==='store')return [['home'],['newreq'],['reqs'],['pos'],['stock']];

/* ---------- home ---------- */
function pendingFor(u){
  const out=[];
  visibleReqs().filter(r=>isOpen(r)&&canAct(r)).sort(sortUrgent).forEach(r=>out.push({k:'req',r,due:r.deadline}));
  S.qty.filter(q=>(q.status==='pm'&&u.role==='pm')||(q.status==='trio'&&actingFor(u.id).includes(q.trio))).forEach(q=>out.push({k:'qty',q,due:now()}));
  if(u.role==='store')S.pos.filter(p=>p.site===u.site&&p.closeReq?.status==='pending').forEach(p=>out.push({k:'close',p,due:now()}));
  return out.sort((a,b)=>a.due-b.due);
}
function reqRow(r){
  const cats=catsOf(r);
  return `<button class="row" onclick="A.go('req','${r.id}')">
    <div class="main"><div><span class="mono">${r.no}</span> <span class="muted">· ${esc(site(r.site).name)}</span></div>
    <div class="small muted">${r.items.length} item${r.items.length>1?'s':''} · ${esc(cats.slice(0,2).join(', '))}${cats.length>2?' +'+(cats.length-2):''}</div></div>
    <div class="side">${me()?.role!=='store'&&['quotes','final','issue'].includes(r.stage)&&rateChanges(r).length?'<span class="chip soon">Rate changed</span>':''}${dueChip(r.deadline,!isOpen(r))}${stagePill(r)}${isOpen(r)?`<span class="small muted">${t('withWho')} ${esc(ownerName(r))}, ${dur(now()-r.stageSince)}</span>`:''}</div></button>`;
}

  }).join('');

  }

function itemsTable(r){

   <td class="num">${nf(it.qty)}</td><td>${esc(it.unit)}${it.subUnit?`<small>${esc(it.subUnit)}</small>`:''}</td><td>${esc(it.cat)}</td><td>${esc(it.brand)||'<span class="muted">Any</span>'}</td>
   <td>${it.areaType==='specific'?`${esc(it.areaName)}<small>${esc(it.areaDesc)}</small>`:'Entire project'}</td>${u.role!=='store'?(()=>{const l=lastRate(it.name,r.site,r.id);return l?`<td class="num">${rsd(l.rate)}<small>last order ${fmtD(l.at)}</small></td><td class="num">${rs(l.rate*it.qty)}</td>`:'<td class="num muted small">No past order</td><td></td>'})():''}</tr>`).join('')}

}
/* last purchase rate, estimates, rate-change flags, per-item vendor award */
function lastRate(name,sc,exclReq){const ty=site(sc).type,n=String(name||'').toLowerCase();let best=null;
  S.pos.forEach(p=>{if(site(p.site).type!==ty||p.reqId===exclReq)return;p.lines.forEach(l=>{if(l.name.toLowerCase()===n&&l.rate>0&&(!best||p.createdAt>best.at))best={rate:l.rate,unit:l.unit,at:p.createdAt,vendor:V(p.vendorId)?.name||'',po:p.no}})});return best}
const rsd=x=>'₹'+(+x).toLocaleString('en-IN',Number.isInteger(+x)?{}:{minimumFractionDigits:2,maximumFractionDigits:2});
function rateFlag(x,last){if(!x||!last)return '';const pct=(x-last.rate)/last.rate*100;if(Math.abs(pct)<0.5)return '<span class="rflag same">Same as last order</span>';return `<span class="rflag ${pct>0?'up':'down'}">${pct>0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% vs last ${rsd(last.rate)}</span>`}
function rateChanges(r){const out=[];r.items.forEach(it=>{const last=lastRate(it.name,r.site,r.id);if(!last)return;(r.quotes[it.cat]||[]).forEach(q=>{const x=+q.rates[it.id];if(x>0){const pct=(x-last.rate)/last.rate*100;if(Math.abs(pct)>=0.5)out.push({it,q,x,last,pct})}})});return out}
function estimate(r){let sum=0,have=0;r.items.forEach(it=>{const l=lastRate(it.name,r.site,r.id);if(l){sum+=l.rate*it.qty;have++}});return {sum,have,n:r.items.length}}
function lowestQ(r,it){let b=null;(r.quotes[it.cat]||[]).forEach(q=>{const x=+q.rates[it.id];if(x>0&&(!b||x<+b.rates[it.id]))b=q});return b}
function awardOf(r,it){const id=r.award?.[it.id];return (r.quotes[it.cat]||[]).find(q=>q.id===id&&+q.rates[it.id]>0)||lowestQ(r,it)}
function awardSummary(r){const by={};let total=0;r.items.forEach(it=>{const q=awardOf(r,it);if(!q)return;const v=+q.rates[it.id]*it.qty*(1+(+q.gst||0)/100);total+=v;const n=V(q.vendorId)?.name||'Vendor';(by[n]=by[n]||{n:0,v:0});by[n].n++;by[n].v+=v});return {by,total}}
const canChoose=r=>(r.stage==='final'&&canAct(r))||(r.stage==='issue'&&r.pmDecides&&me()?.role==='pm');
function estLine(r){const e=estimate(r);return `<p class="small"><b>Estimated value: ${rs(e.sum)}</b> <span class="muted">before GST, at last order rates. ${e.have===e.n?'All items have a past rate.':`${e.n-e.have} of ${e.n} item${e.n>1?'s':''} ordered for the first time, not included.`}</span></p>`}
function compareTable(r,cat,k){
  const u=me(),its=r.items.filter(i=>i.cat===cat),qs=r.quotes[cat]||[];
  if(!qs.length)return '<p class="muted small">No quotes yet.</p>';
  const choose=canChoose(r),showAw=['issue','approved'].includes(r.stage)||choose,pmEdit=r.stage==='quotes'&&u.role==='pm';
  const tot=qs.map(q=>quoteTotal(its,q)),min=Math.min(...tot);
  return `<div class="tw"><table class="cmp"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Last order</th>${qs.map(q=>`<th class="num">${esc(V(q.vendorId)?.name)}<small>${esc(q.brand)} · GST ${q.gst}%${q.files?.length?' · from file':''}</small>${q.contract?'<span class="chip info">Rate contract</span>':''}</th>`).join('')}<th>Cheapest vendor</th></tr></thead>
  <tbody>${its.map(it=>{const rates=qs.map(q=>+q.rates[it.id]||0),pos=rates.filter(x=>x>0),m=pos.length?Math.min(...pos):0,last=lastRate(it.name,r.site,r.id),aw=awardOf(r,it);
    const cheapest=qs.filter((q,j)=>rates[j]===m&&m>0).map(q=>V(q.vendorId)?.name);
    return `<tr><td>${esc(it.name)}</td><td class="num">${nf(it.qty)} ${esc(it.unit)}</td>
    <td class="num">${last?`${rsd(last.rate)}<small>${esc(last.vendor)}</small><small>${fmtD(last.at)}</small>`:'<span class="muted small">No past order</span>'}</td>
    ${rates.map((x,j)=>{const q=qs[j],isAw=aw&&aw.id===q.id;return `<td class="num ${x===m&&x>0&&qs.length>1?'best':''} ${showAw&&isAw?'aw':''}">${x?rsd(x):'—'}${x?`<small>per ${esc(it.unit.replace(/s$/,''))} · = ${rs(x*it.qty)}</small>`:''}${rateFlag(x,last)}
      ${choose&&x?`<label class="awpick"><input type="radio" name="aw_${it.id}" ${isAw?'checked':''} onchange="A.award('${r.id}','${it.id}','${q.id}')"> Order from here</label>`:showAw&&isAw?'<span class="chip ok">Chosen</span>':''}</td>`}).join('')}
    <td><b>${cheapest.map(esc).join(', ')||'—'}</b>${cheapest.length?`<small>${rsd(m)} per ${esc(it.unit.replace(/s$/,''))}</small>`:''}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td colspan="3">Total incl. GST (all items from this vendor)</td>${tot.map(x=>`<td class="num ${x===min&&qs.length>1?'best':''}">${rs(x)}${x===min&&qs.length>1?'<small>Lowest</small>':''}</td>`).join('')}<td></td></tr>
  ${pmEdit?`<tr><td colspan="3"></td>${qs.map(q=>`<td class="num"><button class="linkbtn small" onclick="A.delQuote('${r.id}',${k},'${q.id}')">Remove</button></td>`).join('')}<td></td></tr>`:''}
  </tfoot></table></div>`;
}
function awardBox(r){const {by,total}=awardSummary(r);const e=Object.entries(by);if(!e.length)return '';
  return `<div class="box"><div class="boxh"><h3>${r.stage==='approved'?'Ordered from':canChoose(r)?'Your choice so far':'Chosen vendors'}</h3><span class="num"><b>${rs(total)}</b> <span class="small muted">incl. GST</span></span></div>
  <div class="pickrow">${e.map(([n,x])=>`<span class="pick">${esc(n)} · ${x.n} item${x.n>1?'s':''} · ${rs(x.v)}</span>`).join('')}</div>
  ${e.length>1?`<p class="small muted">${e.length} separate purchase orders will be issued, one per vendor.</p>`:''}</div>`}
function changesBox(r){const ch=rateChanges(r);if(!ch.length||me()?.role==='store')return '';
  return `<div class="note"><b>${ch.length} quoted rate${ch.length>1?'s differ':' differs'} from the last order</b><ul class="flaglist">${ch.map(c=>`<li>${esc(c.it.name)}: ${esc(V(c.q.vendorId)?.name)} quotes ${rsd(c.x)}, last order ${rsd(c.last.rate)} from ${esc(c.last.vendor)} on ${fmtD(c.last.at)} <b class="${c.pct>0?'up':'down'}">(${c.pct>0?'+':''}${c.pct.toFixed(1)}%)</b></li>`).join('')}</ul></div>`}


function reqView(r){
  if(!r)return '<p>Not found.</p>';
  const u=me(),s=site(r.site),cats=catsOf(r);
  const showQ=u.role!=='store'&&(['quotes','final','issue','approved'].includes(r.stage)||Object.keys(r.quotes).length);
  const pmQ=r.stage==='quotes'&&u.role==='pm';
  let act='';

    const o=ownerOf(r),behalf=o!=='pm'&&o!=='store'&&o!==u.id?`<p class="note info">You are acting on behalf of ${esc(uname(o))}, who has handed over approvals.</p>`:'';
    if(r.stage==='ajay_ok'||r.stage==='ravi_ok')act=`${behalf}<div class="actions"><button class="btn primary" onclick="A.approve('${r.id}')">Approve</button><button class="btn" onclick="A.sendBack('${r.id}')">Send back for clarification</button><button class="btn danger" onclick="A.reject('${r.id}')">Reject</button></div>`;
    if(r.stage==='quotes'){const sc2=smallCheck(r);act=(sc2.ok?`<p class="note good"><b>Small order:</b> ${rs(sc2.total)} incl. GST, and every rate is the same or lower than the last order. You can place this order yourself without Raunak's confirmation. Raunak will be informed.</p>`:'')}
    if(r.stage==='quotes')act+=`<div class="actions">${smallCheck(r).ok?`<button class="btn primary" onclick="A.smallOrder('${r.id}')">Place order directly (under ${rs(SMALL_LIMIT)})</button>`:''}<button class="btn ${smallCheck(r).ok?'':'primary'}" onclick="A.toFinal('${r.id}')">Send comparison to Raunak</button><button class="btn" onclick="A.sendBack('${r.id}')">Send back to storekeeper</button></div>`;
    if(r.stage==='final')act=`${behalf}<p class="small muted">Pick the vendor for each item in the tables above. The cheapest is picked already. The procurement manager then issues the POs, one per vendor.</p><div class="actions"><button class="btn primary" onclick="A.confirmVendors('${r.id}')">Confirm vendors</button><button class="btn" onclick="A.pmDecide('${r.id}')">Let procurement manager decide</button><button class="btn" onclick="A.moreQuotes('${r.id}')">Ask for more quotes</button><button class="btn" onclick="A.sendBack('${r.id}')">Send back to storekeeper</button><button class="btn danger" onclick="A.reject('${r.id}')">Reject</button></div>`;
    if(r.stage==='issue'){const n=Object.keys(awardSummary(r).by).length;act=`${r.pmDecides?'<p class="note info">Raunak asked you to choose the vendors. Pick the vendor for each item in the tables above. The cheapest is picked already.</p>':`<p class="note good">${esc(uname(r.awardBy||'raunak'))} confirmed the vendors. Issue the purchase orders below.</p>`}${s.companies.length>1?`<label style="max-width:360px">Bill to company<select onchange="R('${r.id}').company=this.value;save()">${s.companies.map(c=>`<option ${c===(r.company||s.companies[0])?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`:''}<div class="actions"><button class="btn primary" onclick="A.issuePOs('${r.id}')">Issue ${n>1?n+' purchase orders':'purchase order'}</button><button class="btn" onclick="A.sendBack('${r.id}')">Send back to storekeeper</button></div>`}
    if(r.stage==='clarify')act=`<div class="sec"><p class="note"><b>${esc(uname(r.remarks.filter(x=>x.kind==='Sent back').slice(-1)[0]?.by))} asked:</b> ${esc(r.remarks.filter(x=>x.kind==='Sent back').slice(-1)[0]?.text)}</p><p class="small muted">Add the missing details in the items above, then reply.</p><label>Your reply<textarea id="reply" placeholder="e.g. Photo added. Wire is 12 gauge, 1 roll = 25 kg."></textarea></label><div class="actions"><button class="btn primary" onclick="A.resubmit('${r.id}')">Send reply and resubmit</button></div></div>`;
  }
  if(u.role==='store'&&u.site===r.site&&isOpen(r)&&r.stage!=='clarify')act+=`<div class="actions"><button class="btn urgent" onclick="A.urgent('${r.id}')">${t('urgent')}</button><span class="small muted">Sends a WhatsApp nudge to ${esc(ownerName(r))}</span></div>`;
  const pos=S.pos.filter(p=>p.reqId===r.id);
  const tl=[...r.remarks.map(x=>({at:x.at,by:x.by,text:`${x.kind}: ${x.text}`})),...S.audit.filter(a=>a.ref===r.no)].sort((a,b)=>b.at-a.at);
  return `<div class="head"><div><button class="linkbtn small" onclick="A.go('reqs')">← ${t('reqs')}</button><h1 class="mono" style="font-size:1.3rem;margin-top:4px">${r.no}</h1>

    <div class="actions">${dueChip(r.deadline,!isOpen(r))}${stagePill(r)}</div></div>
  ${tracker(r)}
  ${isOpen(r)?`<p class="small">${t('withWho')}: <b>${esc(ownerName(r))}</b> <span class="muted">for ${dur(now()-r.stageSince)}${now()-r.stageSince>4*H?' · auto reminder sent':''}</span></p>`:''}
  <section class="sec"><div class="head"><h2>Items</h2>${canEditItems(r)&&tmp.edit?.rid!==r.id?`<button class="btn sm" onclick="A.edStart('${r.id}')">Edit items</button>`:''}</div>${tmp.edit?.rid===r.id&&canEditItems(r)?editTable(r):itemsTable(r)}${u.role!=='store'?estLine(r):''}</section>
  ${showQ?`<section class="sec"><div class="head"><h2>Quotes</h2><div class="actions">${pmQ?'<span class="small muted">Add as many quotes as you like for each category</span>':''}${u.role!=='store'&&Object.values(r.quotes).some(a=>a.length)?`<button class="btn sm" onclick="A.xlsx('${r.id}',this)">Download comparison (Excel)</button>`:''}</div></div>
    ${contractBox(r)}${changesBox(r)}${cats.map((c,k)=>`<div class="box"><div class="boxh"><h3>${esc(c)}</h3>${pmQ||(u.id==='raunak'&&isOpen(r))?`<div class="actions"><button class="btn sm" onclick="A.sheet('${r.id}',${k})">Vendor sheet</button>${pmQ?`<button class="btn sm primary" onclick="A.addQuote('${r.id}',${k})">Add quote</button>`:''}</div>`:''}</div>${compareTable(r,c,k)}</div>`).join('')}${['final','issue','approved'].includes(r.stage)?awardBox(r):''}</section>`:''}
  ${pos.length?`<section class="sec"><h2>Purchase orders</h2><div class="list">${pos.map(poRow).join('')}</div></section>`:''}
  ${act?`<section class="sec">${act}</section>`:''}

/* ---------- purchase orders ---------- */
function poStatus(p){if(p.status==='closed')return '<span class="chip">Closed</span>';if(p.status==='done')return '<span class="chip ok">Fully received</span>';const rec=p.lines.some(l=>l.received>0);return `<span class="chip ${rec?'soon':'info'}">${rec?'Partly received':'Open'}</span>`}
function poRow(p){return `<button class="row" onclick="A.go('po','${p.id}')"><div class="main"><div><span class="mono">${p.no}</span> <span class="muted">· ${esc(site(p.site)?.name)}</span></div><div class="small muted">${esc(V(p.vendorId)?.name)} · ${esc(p.cat)}</div></div><div class="side">${me()?.role==='store'?'':`<span class="small num">${rs(poValue(p))}</span>`}${poStatus(p)}</div></button>`}
function posView(){const l=visiblePOs().sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||b.createdAt-a.createdAt);
  return `<div class="head"><h1>${t('pos')}</h1></div><div class="list">${l.map(poRow).join('')||'<p class="empty">No purchase orders yet. They are created when Raunak gives final approval.</p>'}</div>`}
function poView(p){
  if(!p)return '<p>Not found.</p>';
  const u=me(),s=site(p.site),v=V(p.vendorId);
  const sub=p.lines.reduce((a,l)=>a+l.qty*l.rate,0),gst=p.lines.reduce((a,l)=>a+l.qty*l.rate*l.gst/100,0);
  const myStore=u.role==='store'&&u.site===p.site;

function shrinkImg(blob,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok({blob:b,url:c.toDataURL('image/jpeg',.7)}),'image/jpeg',q)};img.onerror=()=>{URL.revokeObjectURL(u);no({code:'image_rejected'})};img.src=u})}
function slipPrompt(sc){const s=site(sc),master=masterFor(sc);
  return `A storekeeper at ${s.name} (Kailasha Group, Siliguri, India; ${s.type==='mfg'?'a beverage factory':'a real estate construction site'}) photographed a handwritten material requisition slip. It may be in Hindi, English or a mix, may use local words (e.g. "sariya" = TMT bar, "gitti" = stone chips, "balu" = sand, "bora/bori" = bags) and abbreviations. Read every line and turn it into requisition items.

Our item list (prefer these exact names when the slip means the same item):
${JSON.stringify(master.map(x=>({name:x.name,unit:x.unit,sub_unit:x.subUnit||undefined,category:x.cat})).slice(0,400))}

Units we use: ${JSON.stringify([...S.units,...S.unitsPending])}
Categories: ${JSON.stringify(catsFor(sc))}

For each line on the slip give:
- slip_text: the line as written (keep Hindi as Hindi).
- list_name: the exact name from our item list if it is clearly the same item, else null.
- name: a clear English item name (use list_name if given; otherwise write size, grade and type in English, e.g. "TMT bar 12 mm").
- qty: number. unit: one of our units if possible (convert spelling, e.g. "bori" -> "bags", "pcs" -> "nos"). sub_unit: packing if written (e.g. "bag of 50 kg"), else "".
- category: one of our categories.
- brand: if written, else "". spec: any size, grade, colour or note, else "".
- area: the place of use if written (e.g. "Tower A 3rd floor slab"), else "".
- sure: true if you read the line clearly and matched it confidently; false if handwriting was unclear, the quantity or unit is a guess, or the item is ambiguous.
Also: needed_by as YYYY-MM-DD if a date is written (assume year ${YEAR}), else "". notes: one short plain sentence if something on the slip could not be read, else "".

Reply with JSON only, in this shape:
{"needed_by":"","items":[{"slip_text":"","list_name":null,"name":"","qty":0,"unit":"","sub_unit":"","category":"","brand":"","spec":"","area":"","sure":true}],"notes":""}`}
const slipErr=e=>({not_granted:'Reading was not allowed, so please fill the items by hand.',rate_limited:'Too many readings just now. Wait a minute and try again.',image_rejected:'That picture could not be read. Take a clearer photo in good light.',lib:'Could not open the PDF reader. Check the internet connection.'})[e?.code]||'Could not read the slip. Please try a clearer photo, or fill the items by hand.';
A.slip=async input=>{
  const files=[...(input.files||[])];input.value='';if(!files.length)return;
  const st=document.getElementById('slipst'),sc=me().site;st.hidden=false;
  if(!SAMPLE||!SAMPLE_IMG){st.className='note';st.textContent='Reading slips is not available in this view. Please fill the items by hand.';return}
  else{st.className='note info';st.textContent='Reading the slip. This usually takes 20 to 60 seconds…'}
  try{
    const send=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){const x=await readPdf(f,true);send.push(...x.imgs)}
      else if(f.type.startsWith('image/')){send.push((await shrinkImg(f,1800,.85)).blob)}
    }
    if(!send.length)return;
    const res=await SAMPLE.json(slipPrompt(sc),{images:send.slice(0,SAMPLE_LIM||5)});
    if(view.v!=='newreq'||!draft)return;
    const master=masterFor(sc),units=[...S.units,...S.unitsPending],cats=catsFor(sc);
    const got=(Array.isArray(res?.items)?res.items:[]).slice(0,60).map(x=>{
      const m=x?.list_name?master.find(y=>y.name.toLowerCase()===String(x.list_name).toLowerCase()):null;
      const unit=units.find(u=>u.toLowerCase()===String(x?.unit||'').toLowerCase())||(m?.unit||'');
      const cat=cats.includes(x?.category)?x.category:(m?.cat||'');const area=String(x?.area||'').trim();
      return {...blankItem(sc),name:String(m?.name||x?.name||'').slice(0,160),orig:'',qty:+x?.qty>0?String(+x.qty):'',unit,subUnit:String(x?.sub_unit||m?.subUnit||'').slice(0,80),cat,brand:String(x?.brand||m?.brand||'').slice(0,80),spec:String(x?.spec||'').slice(0,300),
        areaType:area?'specific':(site(sc).type==='mfg'?'':'entire'),areaName:area.slice(0,80),areaDesc:'',fromList:!!m,slipText:String(x?.slip_text||'').slice(0,200),slipSure:x?.sure===true&&!!unit&&!!cat&&+x?.qty>0}});
    if(!got.length){st.className='note';st.textContent='No items could be read from this slip. Please fill them by hand.';return}
    draft.items=[...draft.items.filter(i=>i.name.trim()),...got];
    if(/^\d{4}-\d{2}-\d{2}$/.test(res?.needed_by||''))draft.deadline=res.needed_by;
    const unsure=got.filter(i=>!i.slipSure).length;
    tmp.slipMsg={cls:unsure?'note':'note good',html:`Read ${got.length} item${got.length>1?'s':''} from the slip. Check each one before sending.`+(unsure?` <b>${unsure} line${unsure>1?'s are':' is'} marked in amber</b> because the writing or quantity was unclear.`:'')+(res?.notes?`<br>${esc(String(res.notes).slice(0,300))}`:'')};
    render();
  }catch(e){const s2=document.getElementById('slipst');if(s2){s2.className='note';s2.textContent=slipErr(e)}}
};

/* ---------- rate contracts (brand price list + agreed discount) ---------- */
function discFactor(d){return String(d||'0').split('+').map(x=>parseFloat(x)||0).reduce((f,p)=>f*(1-p/100),1)}
function rowDisc(list,row){const g=(list.disc||[]).find(x=>x.group&&normTxt(x.group)===normTxt(row.g));return g?g.d:(list.defDisc||'0')}
const rowNet=(list,row)=>row.price*discFactor(rowDisc(list,row));
const listsFor=sc=>S.rateLists.filter(l=>l.type===site(sc).type&&l.rows.length);
function contractOffers(r,it){const out=[];listsFor(r.site).forEach(l=>{const m=S.contractMap[l.id+'|'+normTxt(it.name)];if(m&&l.rows[m.row]){const row=l.rows[m.row];out.push({l,row,m,net:rowNet(l,row)*(m.factor||1)})}});return out.sort((a,b)=>a.net-b.net)}
function refreshContractQuotes(r){let added=0;
  Object.keys(r.quotes).forEach(c=>r.quotes[c]=r.quotes[c].filter(q=>!q.contract));
  listsFor(r.site).forEach(l=>{if(!l.vendorId||!V(l.vendorId))return;
    catsOf(r).forEach(cat=>{const rates={};r.items.filter(i=>i.cat===cat).forEach(it=>{const o=contractOffers(r,it).find(x=>x.l.id===l.id);if(o)rates[it.id]=Math.round(o.net*100)/100});

function contractBox(r){if(me()?.role==='store'||!listsFor(r.site).length)return '';

A.ctCheck=async(rid,btn)=>{const r=R(rid),lists=listsFor(r.site);if(!lists.length)return toast('No rate contracts yet. Add one under Rate contracts.');
  const todo=r.items.filter(it=>lists.some(l=>!S.contractMap[l.id+'|'+normTxt(it.name)]));
  if(todo.length&&SAMPLE){btn.disabled=true;btn.textContent='Matching…';
    try{const words=t2=>normTxt(t2).split(' ').filter(w=>w.length>1);
      const cand=lists.map(l=>({list_id:l.id,brand:l.brand,rows:l.rows.map((row,i)=>({i,group:row.g,name:row.name,unit:row.unit})).filter(row=>todo.some(it=>words(it.name+' '+it.spec).some(w=>normTxt(row.name+' '+row.group).includes(w)))).slice(0,150)}));
      const res=await SAMPLE.json(`Match a construction/factory material requisition to brand price lists. For each requisition item and each price list, pick the ONE row that is the same product (same material, type, size and pressure class), or none. Sizes may be written in inches or mm (1/2"=15 mm, 3/4"=20 mm, 1"=25 mm, 1 1/4"=32 mm, 1 1/2"=40 mm, 2"=50 mm).
Requisition items: ${JSON.stringify(todo.map(it=>({id:it.id,name:it.name,qty:it.qty,unit:it.unit,sub_unit:it.subUnit||undefined,spec:it.spec||undefined})))}
Price lists: ${JSON.stringify(cand)}
factor = how many price-list units make ONE of our units (e.g. our unit "metres", list unit "length of 3 m" -> 0.3333; same unit -> 1).
sure = true only if size and type clearly match.
Reply with JSON only: {"matches":[{"item_id":"","list_id":"","row":0,"factor":1,"sure":true}]}`);
      (res?.matches||[]).forEach(m=>{const l=lists.find(x=>x.id===m.list_id),it=todo.find(x=>x.id===m.item_id);if(l&&it&&l.rows[+m.row])S.contractMap[l.id+'|'+normTxt(it.name)]={row:+m.row,factor:+m.factor>0?+m.factor:1,sure:m.sure===true}})}
    catch(e){toast(qErrCopy(e))}}
  else if(todo.length&&!SAMPLE)toast('Automatic matching is not available in this view');
  const n=refreshContractQuotes(r);log('Checked rate contracts'+(n?`: added ${n} contract price list${n>1?'s':''} to the comparison`:''),r.no);render();toast(n?'Contract prices added to the comparison':'No contract matches found')};

async function sheetText(file){const X=await excelLib();const wb=new X.Workbook();await wb.xlsx.load(await file.arrayBuffer());const out=[];wb.eachSheet(ws=>{ws.eachRow(row=>{const v=row.values.slice(1).map(c=>c&&typeof c==='object'?(c.result??c.text??c.richText?.map(t2=>t2.text).join('')??''):c??'').map(String);if(v.some(x=>x.trim()))out.push(`[${ws.name}] `+v.join(' | '))})});return out}
A.ctRead=async()=>{const brand=val('ct_b').trim(),files=[...(document.getElementById('ct_f').files||[])],st=document.getElementById('ct_st');
  if(!brand)return toast('Add the brand name');if(!files.length)return toast('Choose the price list file');
  if(!SAMPLE){st.hidden=false;st.className='note';st.textContent='Reading price lists is not available in this view.';return}
  const go=document.getElementById('ct_go');go.disabled=true;st.hidden=false;st.className='note info';
  const chunks=[];
  try{for(const f of files){
      if(/\.(xlsx|csv)$/i.test(f.name)){const lines=/\.csv$/i.test(f.name)?(await f.text()).split(/\r?\n/).filter(x=>x.trim()):await sheetText(f);for(let i=0;i<lines.length;i+=120)chunks.push({text:lines.slice(i,i+120).join('\n')})}
      else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){const lib=await pdfLib();const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
        for(let i=1;i<=Math.min(doc.numPages,40);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const t2=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('');let img=null;
          if(SAMPLE_IMG){const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;img=await new Promise(res=>c.toBlob(res,'image/jpeg',.85))}
          chunks.push({text:t2,img})}}
      else if(f.type.startsWith('image/')&&SAMPLE_IMG)chunks.push({text:'',img:(await shrinkImg(f,1800,.85)).blob})}
    const rows=[];
    for(let i=0;i<chunks.length;i++){st.textContent=`Reading part ${i+1} of ${chunks.length}… ${rows.length} items so far`;
      const c=chunks[i];const res=await SAMPLE.json(`This is part ${i+1} of a ${brand} price list (Indian building materials or factory supplies). Extract every priced item.
For each item give: group (the section or product group heading, e.g. "Pipes", "Fittings - Elbow", "Valves"), name (full description including size, e.g. "CPVC SDR 11 pipe 25 mm (1 inch)"), unit (what the price is for, e.g. "metre", "length of 3 m", "nos", "box of 10"), price (list price / MRP as a number, before discount; if the list gives price per length and per metre, use per metre).
Skip headings, notes and blank lines. Reply with JSON only: {"rows":[{"group":"","name":"","unit":"","price":0}]}
${c.text?'Text of this part:\n'+c.text.slice(0,50000):'(read the image)'}`,c.img?{images:[c.img]}:{});
      (res?.rows||[]).forEach(x=>{if(x&&x.name&&+x.price>0)rows.push({g:String(x.group||'').slice(0,80),name:String(x.name).slice(0,200),unit:String(x.unit||'nos').slice(0,40),price:+x.price})})}
    if(!rows.length){st.className='note';st.textContent='No priced items could be read from this file.';go.disabled=false;return}
    const l={id:uid(),brand,title:files.map(f=>f.name).join(', '),vendorId:val('ct_v'),type:val('ct_t'),gst:18,defDisc:val('ct_d').trim()||'0',disc:[],rows,uploaded:now(),validTill:''};
    S.rateLists.push(l);log(`Added ${brand} price list (${rows.length} items)`);A.close();A.go('contract',l.id);toast(`${rows.length} items read. Now set the discounts.`)}
  catch(e){st.className='note';st.textContent=qErrCopy(e);go.disabled=false}};

/* small orders: up to Rs 10,000 incl. GST, every rate same or lower than last order -> PM orders directly */
const SMALL_LIMIT=10000;
function smallCheck(r){const why=[];let total=0;
  r.items.forEach(it=>{const q=lowestQ(r,it);if(!q){why.push(`${it.name} has no quote yet`);return}
    const x=+q.rates[it.id];total+=x*it.qty*(1+(+q.gst||0)/100);const l=lastRate(it.name,r.site,r.id);
    if(!l)why.push(`${it.name} has never been ordered before`);else if(x>l.rate+1e-9)why.push(`${it.name} is dearer than last time (${rsd(x)} vs ${rsd(l.rate)})`)});
  if(total>SMALL_LIMIT)why.unshift(`order value is ${rs(total)}, above ${rs(SMALL_LIMIT)}`);
  return {ok:!why.length,total,why}}
A.smallOrder=async id=>{const r=R(id),c=smallCheck(r);if(!c.ok)return toast('Not allowed: '+c.why[0]);
  r.award={};r.items.forEach(it=>r.award[it.id]=lowestQ(r,it).id);r.smallOrder=true;r.awardBy='pm';
  log(`Cleared under the ${rs(SMALL_LIMIT)} rule: value ${rs(c.total)}, every rate same or lower than the last order. Raunak's confirmation not needed.`,r.no);
  r.stage='issue';r.stageSince=now();render();
  if(!(await Live.flush()))return;
  A.issuePOs(id);
  send(targets('raunak'),`For your information: ${r.no} (${site(r.site).name}) ordered directly by the procurement manager under the ${rs(SMALL_LIMIT)} rule. Value ${rs(c.total)}, all rates same or lower than last time.`,'Small order')};

/* reading a vendor quotation (PDF / photo) with Claude */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no({code:'lib'});document.head.appendChild(s)})}
async function pdfLib(){if(window.pdfjsLib)return window.pdfjsLib;const b='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';await loadScript(b+'pdf.worker.min.js');await loadScript(b+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js';return window.pdfjsLib}
async function readPdf(file,wantImgs){
  const lib=await pdfLib();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let text='';const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,6);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const t=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('');text+=`\n--- page ${i} ---\n${t}`;
    if(wantImgs&&imgs.length<3){const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;imgs.push(await new Promise(res=>c.toBlob(res,'image/jpeg',.85)))}}
  return {text,imgs}}
const normTxt=t=>String(t||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g,' ').trim();
function quotePrompt(r,cat,its,text){
  const known=[];for(const [vid,m] of Object.entries(S.aliases||{}))for(const [vt,ours] of Object.entries(m))known.push({vendor:V(vid)?.name,vendor_wrote:vt,our_item:ours});
  return `You are helping a procurement manager at Kailasha Group (Siliguri, India) enter a vendor's quotation. Read the attached quotation (text extracted from the PDF is below, and page images or photos may be attached). Vendors often name items differently from us (for example "FRLS 2.5 sqmm Cu wire" for our "FR copper wire 2.5 sq mm", or a brand's catalogue name), so match by meaning: size, grade, material and type.

Items we asked for (category: ${cat}):
${JSON.stringify(its.map(i=>({id:i.id,name:i.name,qty:i.qty,unit:i.unit,sub_unit:i.subUnit||undefined,brand_we_suggested:i.brand||undefined,spec:i.spec||undefined})))}

Vendors already in our directory:
${JSON.stringify(S.vendors.map(v=>({id:v.id,name:v.name,gstin:v.gstin})))}

Name matches the manager confirmed before (treat these as certain when the same vendor uses the same wording):
${JSON.stringify(known.slice(-200))}

List EVERY priced line in the quotation in "lines", in the order it appears:
- vendor_text: the item description exactly as the vendor wrote it.
- vendor_rate_text: the rate and its unit as the vendor wrote it (e.g. "2,080 per coil").
- item_id: the id of OUR item this line is for, or null if it matches none of ours.
- rate: the rate per ONE of OUR unit for that item, BEFORE GST, as a number. Convert units if needed (per coil vs per metre, per bag of 2,000 vs per nos, per tonne vs per kg) and remove GST if the rate includes it. null if item_id is null and no sensible conversion exists.
- sure: true only if you are confident the line is the same item as ours (same size, grade and type). false if it is a near match, a different size or grade, or you had to guess.
Also give:
- gst_percent: the GST rate the vendor applies (0, 5, 12, 18 or 28); if several, the most common, and mention the others in notes.
- vendor_id: the id from our directory if clearly the same business (same name or GSTIN), else null.
- brand: the brand(s) offered, short.
- notes: one or two short plain-English sentences on what the manager must check (conversions, freight or loading, validity, delivery time). Empty string if nothing.

Reply with JSON only, in exactly this shape:
{"vendor_id":null,"vendor_name":"","vendor_gstin":"","vendor_phone":"","brand":"","gst_percent":18,"lines":[{"vendor_text":"","vendor_rate_text":"","item_id":null,"rate":null,"sure":true}],"notes":""}

Quotation text:
${(text||'(no text layer, read the images)').slice(0,60000)}`}
function qErrCopy(e){return ({not_granted:'Reading was not allowed, so please type the rates below.',rate_limited:'Too many readings just now. Wait a minute and try again, or type the rates below.',lib:'Could not open the PDF reader. Check the internet connection, or type the rates below.',noimg:'Photos cannot be read in this view. Upload a PDF, or type the rates below.',image_rejected:'That picture could not be read. Try a clearer photo or the PDF.'})[e?.code]||'Could not read this quotation. Please type the rates below.'}
A.qFile=async(rid,k,input)=>{
  const files=[...(input.files||[])];if(!files.length)return;
  const r=R(rid),cat=catsOf(r)[k],its=r.items.filter(i=>i.cat===cat),st=document.getElementById('q_st');
  tmp.qfiles=files.map(f=>f.name);st.hidden=false;
  if(!SAMPLE){st.className='note';st.textContent='Automatic reading is not available here. The file is attached, so please type the rates below.';return}
  st.className='note info';st.textContent='Reading the quotation. This usually takes 15 to 60 seconds…';input.disabled=true;
  const mine=tmp.qbusy=uid();
  try{
    let text='',imgs=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){const x=await readPdf(f,SAMPLE_IMG);text+=`\n=== ${f.name} ===${x.text}`;imgs.push(...x.imgs)}
      else if(f.type.startsWith('image/'))imgs.push(f);
    }
    if(!SAMPLE_IMG){imgs=[];if(!text.replace(/[\s=\-a-z0-9.]*page \d+/gi,'').trim())throw {code:'noimg'}}
    imgs=imgs.slice(0,SAMPLE_LIM||5);
    const res=await SAMPLE.json(quotePrompt(r,cat,its,text),imgs.length?{images:imgs}:{});
    if(tmp.qbusy!==mine||!document.getElementById('q_v'))return;
    fillQuote(res,its,files);
  }catch(e){if(document.getElementById('q_st')){st.className='note';st.textContent=qErrCopy(e)}}
  finally{input.disabled=false}
};
function fillQuote(res,its,files){
  const mark=el=>el&&el.classList.add('filled');
  const sel=document.getElementById('q_v');
  if(res?.vendor_id&&V(res.vendor_id)){sel.value=res.vendor_id;mark(sel)}
  else if(res?.vendor_name){tmp.newVendor={name:String(res.vendor_name).slice(0,120),gstin:String(res.vendor_gstin||'').toUpperCase().slice(0,15),phone:String(res.vendor_phone||'').slice(0,30)};
    const o=document.createElement('option');o.value='__new';o.textContent='New vendor: '+tmp.newVendor.name;sel.prepend(o);sel.value='__new';mark(sel)}
  if(res?.brand){const b=document.getElementById('q_b');b.value=String(res.brand).slice(0,120);mark(b)}
  const g=+res?.gst_percent;if([0,5,12,18,28].includes(g)){const s2=document.getElementById('q_g');s2.value=String(g);mark(s2)}
  const ids=new Set(its.map(i=>i.id));
  const lines=(Array.isArray(res?.lines)?res.lines:[]).slice(0,80).map(l=>({text:String(l?.vendor_text||'').slice(0,200),rateText:String(l?.vendor_rate_text||'').slice(0,80),itemId:ids.has(l?.item_id)?l.item_id:null,rate:+l?.rate>0?+l.rate:null,sure:l?.sure===true,remembered:false}));
  // matches the manager confirmed before for this vendor win
  const vid=sel.value,al=(S.aliases||{})[vid]||{};
  lines.forEach(l=>{const ours=al[normTxt(l.text)];if(ours){const it=its.find(i=>i.name.toLowerCase()===ours.toLowerCase());if(it){l.itemId=it.id;l.sure=true;l.remembered=true}}});
  tmp.qlines=lines;tmp.qmap={};
  its.forEach(it=>{const cand=lines.map((l,k)=>({l,k})).filter(x=>x.l.itemId===it.id).sort((a,b)=>(b.l.sure-a.l.sure));const pick=cand[0];
    tmp.qmap[it.id]=pick?pick.k:-1;if(pick&&pick.l.rate){const el=document.getElementById('q_'+it.id);el.value=Math.round(pick.l.rate*100)/100;mark(el)}
    drawMatch(it.id,pick?(pick.l.sure&&cand.length===1?'ok':'check'):'none')});
  const used=new Set(Object.values(tmp.qmap));
  const unmatched=lines.filter((l,k)=>!used.has(k));
  const flagged=its.filter(it=>document.getElementById('qm_'+it.id)?.classList.contains('amber')).length;
  const st=document.getElementById('q_st');st.className='note good';
  st.innerHTML=`Filled in from ${esc(files.map(f=>f.name).join(', '))}. Check every number against the quotation before saving.`+
    (flagged?`<br><b>${flagged} item${flagged>1?'s':''} need${flagged>1?'':'s'} your check</b> (marked in amber below). Pick the matching line from the quotation.`:'')+
    (tmp.newVendor?`<br>This vendor is not in your directory yet. Saving will add <b>${esc(tmp.newVendor.name)}</b>${tmp.newVendor.gstin?' (GSTIN '+esc(tmp.newVendor.gstin)+')':''}.`:'')+
    (res?.notes?`<br><b>Please check:</b> ${esc(String(res.notes).slice(0,500))}`:'')+
    (unmatched.length?`<br><b>Lines in the quotation that match none of your items:</b> ${unmatched.map(l=>esc(l.text)).join('; ')}`:'');
}
function drawMatch(itemId,state){
  const box=document.getElementById('qm_'+itemId);if(!box)return;const lines=tmp.qlines||[],k=tmp.qmap[itemId],l=lines[k];
  box.hidden=false;box.className='qmatch'+(state==='ok'?'':' amber');
  const opts=`<option value="-1">${l?'None of these':'Choose the matching line'}</option>`+lines.map((x,j)=>`<option value="${j}" ${j===k?'selected':''}>${esc(x.text)}${x.rateText?' · '+esc(x.rateText):''}</option>`).join('');
  box.innerHTML=(l?`<span>Vendor wrote: <b>${esc(l.text)}</b>${l.rateText?' · '+esc(l.rateText):''}${l.remembered?' <span class="chip ok">Matched before</span>':''}</span>`:'<span><b>Not found in the quotation.</b> Pick a line, or type the rate.</span>')
    +(state==='ok'?`<button type="button" class="linkbtn small" onclick="A.qMatchEdit('${itemId}')">Wrong match?</button>`:`${l?'<span>Not sure this is the same item. Confirm or pick the right line:</span>':''}<select aria-label="Matching line in the quotation" onchange="A.qLine('${itemId}',+this.value)">${opts}</select>${l?`<button type="button" class="btn sm" onclick="A.qLine('${itemId}',${k})">Yes, same item</button>`:''}`);
}
A.qMatchEdit=id=>drawMatch(id,'check');
A.qLine=(itemId,k)=>{tmp.qmap[itemId]=k;tmp.qconfirmed=tmp.qconfirmed||{};tmp.qconfirmed[itemId]=k>=0;const l=tmp.qlines[k];const el=document.getElementById('q_'+itemId);
  if(l){if(l.rate)el.value=Math.round(l.rate*100)/100;else el.value='';el.classList.add('filled');drawMatch(itemId,'ok')}else{el.value='';el.classList.remove('filled');drawMatch(itemId,'none')}};
A.saveQuote=(rid,k)=>{const r=R(rid),cat=catsOf(r)[k],its=r.items.filter(i=>i.cat===cat),rates={};
  for(const it of its){const x=+val('q_'+it.id);if(!(x>0)){document.getElementById('q_err').textContent='Enter a rate for every item.';return}rates[it.id]=x}
  let vid=val('q_v');
  if(vid==='__new'){const nv=tmp.newVendor;vid=uid();S.vendors.push({id:vid,name:nv.name,contact:'',phone:nv.phone,email:'',gstin:nv.gstin,city:'',cats:cat});log('Added vendor '+nv.name+' from a quotation')}
  let learnt=0;S.aliases=S.aliases||{};
  its.forEach(it=>{const l=(tmp.qlines||[])[tmp.qmap?.[it.id]];if(!l||!l.text)return;const key=normTxt(l.text);if(!key||key===normTxt(it.name))return;
    if((tmp.qconfirmed?.[it.id]||l.sure)&&(S.aliases[vid]||{})[key]!==it.name){(S.aliases[vid]=S.aliases[vid]||{})[key]=it.name;learnt++}});
  if(learnt)log(`Remembered ${learnt} item name match${learnt>1?'es':''} for ${V(vid).name}`,r.no);
  const q={id:uid(),vendorId:vid,brand:val('q_b').trim()||'As requested',gst:+val('q_g'),rates,at:now(),files:tmp.qfiles||[]};(r.quotes[cat]=r.quotes[cat]||[]).push(q);
  log(`Added quote from ${V(q.vendorId).name} for ${cat}${q.files.length?' (from '+q.files.join(', ')+')':''}`,r.no);tmp.qbusy=null;A.close();render();toast('Quote saved')};

/* Excel quote comparison (item-wise, print-ready) */
async function excelLib(){if(window.ExcelJS)return window.ExcelJS;await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');return window.ExcelJS}
const colL=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
function buildSheet(wb,r,cat){
  const its=r.items.filter(i=>i.cat===cat),qs=r.quotes[cat]||[],nV=Math.max(qs.length,1),F=5,last=F+nV*3+2,cCheap=F+nV*3+1,cSel=F+nV*3+2;
  const ws=wb.addWorksheet(cat.replace(/[\\/*?:\[\]]/g,' ').slice(0,31),{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}},views:[{state:'frozen',xSplit:2,ySplit:7}]});
  ws.pageSetup.printTitlesRow='5:7';ws.headerFooter.oddFooter='&L'+r.no+'&RPage &P of &N';
  const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}}),green=fill('FFDDF1E8'),grey=fill('FFF2F4F3'),amber=fill('FFFDF3E2');
  const thin={style:'thin',color:{argb:'FFBFC7C2'}},box={top:thin,left:thin,bottom:thin,right:thin},NUM='#,##,##0.00',INT='#,##,##0.##';
  ws.mergeCells(1,1,1,last);ws.getCell(1,1).value='KAILASHA GROUP · QUOTE COMPARISON';ws.getCell(1,1).font={bold:true,size:14,color:{argb:'FF0E7A5C'}};
  ws.mergeCells(2,1,2,last);ws.getCell(2,1).value=`Requisition ${r.no}   ·   ${site(r.site).name}   ·   ${cat}`;ws.getCell(2,1).font={bold:true};
  ws.mergeCells(3,1,3,last);ws.getCell(3,1).value=`Needed by ${fmtD(r.deadline)}   ·   Prepared ${fmtDT(now())} by ${uname(S.me)}   ·   Status: ${STAGE[r.stage].label}`;ws.getCell(3,1).font={color:{argb:'FF68736D'}};
  ['S.No','Item','Qty','Unit','Last order rate'].forEach((h,i)=>{ws.mergeCells(5,i+1,7,i+1);ws.getCell(5,i+1).value=h});
  ws.mergeCells(5,cCheap,7,cCheap);ws.getCell(5,cCheap).value='Cheapest vendor';ws.mergeCells(5,cSel,7,cSel);ws.getCell(5,cSel).value='Chosen vendor';
  const tot=qs.map(q=>quoteTotal(its,q)),minT=Math.min(...tot);
  qs.forEach((q,j)=>{const c0=F+1+j*3,v=V(q.vendorId);
    ws.mergeCells(5,c0,5,c0+2);ws.getCell(5,c0).value=v?.name||'Vendor';
    ws.mergeCells(6,c0,6,c0+2);ws.getCell(6,c0).value=`GSTIN ${v?.gstin||'-'} · GST ${q.gst}%`;ws.getCell(6,c0).font={size:9,color:{argb:'FF68736D'}};
    ['Brand','Rate (₹)','Amount (₹)'].forEach((h,i)=>ws.getCell(7,c0+i).value=h)});
  if(!qs.length){ws.mergeCells(5,F+1,7,F+3);ws.getCell(5,F+1).value='No quotes yet'}
  for(let rr=5;rr<=7;rr++)for(let c=1;c<=last;c++){const x=ws.getCell(rr,c);x.fill=grey;x.border=box;x.font={...(x.font||{}),bold:rr!==6};x.alignment={vertical:'middle',horizontal:c===2?'left':'center',wrapText:true}}
  let row=8;
  its.forEach((it,n)=>{
    const rates=qs.map(q=>+q.rates[it.id]||0),pos=rates.filter(x=>x>0),m=pos.length?Math.min(...pos):0,lr=lastRate(it.name,r.site,r.id),aw=awardOf(r,it);
    ws.getCell(row,1).value=n+1;ws.getCell(row,2).value=it.name+(it.spec?`\n${it.spec}`:'')+(it.subUnit?`\n(${it.subUnit})`:'');
    ws.getCell(row,3).value=it.qty;ws.getCell(row,3).numFmt=INT;ws.getCell(row,4).value=it.unit;
    const lc=ws.getCell(row,5);lc.value=lr?lr.rate:'New item';if(lr){lc.numFmt=NUM;lc.note=`${lr.vendor}, ${fmtD(lr.at)} (${lr.po})`}
    qs.forEach((q,j)=>{const c0=F+1+j*3,x=rates[j];ws.getCell(row,c0).value=q.brand;
      const rc=ws.getCell(row,c0+1);rc.value=x||null;rc.numFmt=NUM;
      const ac=ws.getCell(row,c0+2);ac.value=x?{formula:`C${row}*${colL(c0+1)}${row}`,result:x*it.qty}:null;ac.numFmt=NUM;
      if(x&&x===m&&qs.length>1){rc.fill=green;ac.fill=green;rc.font={bold:true,color:{argb:'FF0E7A5C'}}}
      if(x&&lr&&Math.abs((x-lr.rate)/lr.rate)>=.005){const pct=(x-lr.rate)/lr.rate*100;rc.note=`${pct>0?'Up':'Down'} ${Math.abs(pct).toFixed(1)}% vs last order ${lr.rate}`;if(!(x===m&&qs.length>1))rc.fill=amber}});
    ws.getCell(row,cCheap).value=qs.filter((q,j)=>rates[j]===m&&m>0).map(q=>V(q.vendorId)?.name).join(', ')||'-';ws.getCell(row,cCheap).font={bold:true};
    ws.getCell(row,cSel).value=aw&&['final','issue','approved'].includes(r.stage)?V(aw.vendorId)?.name:'';
    for(let c=1;c<=last;c++){const x=ws.getCell(row,c);x.border=box;x.alignment={vertical:'top',wrapText:true,horizontal:c===2||c>=cCheap||(c>F&&(c-F-1)%3===0)?'left':c<=4?'center':'right'}}
    row++});
  const first=8,lastItem=row-1;
  [['Total before GST'],['GST'],['Total with GST'],['Rank (L1 = lowest)']].forEach(([label],k)=>{const rr=row+k;ws.mergeCells(rr,1,rr,F);ws.getCell(rr,1).value=label;ws.getCell(rr,1).alignment={horizontal:'right'};
    qs.forEach((q,j)=>{const c0=F+1+j*3,AC=colL(c0+2);ws.mergeCells(rr,c0,rr,c0+1);
      const cell=ws.getCell(rr,c0+2);const sub=its.reduce((s2,it)=>s2+(+q.rates[it.id]||0)*it.qty,0);
      if(k===0)cell.value={formula:`SUM(${AC}${first}:${AC}${lastItem})`,result:sub};
      if(k===1){ws.getCell(rr,c0).value=`@ ${q.gst}%`;cell.value={formula:`${AC}${rr-1}*${q.gst/100}`,result:sub*q.gst/100}}
      if(k===2){cell.value={formula:`${AC}${rr-2}+${AC}${rr-1}`,result:tot[j]};if(tot[j]===minT&&qs.length>1)cell.fill=green}
      if(k===3){const rank=[...tot].sort((a,b)=>a-b).indexOf(tot[j])+1;cell.value='L'+rank;if(rank===1)cell.fill=green}
      cell.numFmt=NUM});
    for(let c=1;c<=last;c++){const x=ws.getCell(rr,c);x.border=box;x.font={bold:true};if(x.fill?.fgColor?.argb!=='FFDDF1E8')x.fill=grey;if(c>F)x.alignment={horizontal:'right'}}});
  row+=6;
  ws.getCell(row,1).value='Green: lowest rate in the row and lowest total. Amber: rate differs from the last order (hover the cell for details). Rates are before GST.';ws.getCell(row,1).font={italic:true,size:9,color:{argb:'FF68736D'}};
  row+=3;[['Prepared by',2],['Checked by',F+1],['Vendors confirmed by',Math.min(F+4,last)]].forEach(([t2,c])=>{ws.getCell(row,c).value='____________________';ws.getCell(row+1,c).value=t2});
  ws.getColumn(1).width=6;ws.getColumn(2).width=36;ws.getColumn(3).width=10;ws.getColumn(4).width=9;ws.getColumn(5).width=13;
  qs.forEach((q,j)=>{ws.getColumn(F+1+j*3).width=15;ws.getColumn(F+2+j*3).width=12;ws.getColumn(F+3+j*3).width=14});ws.getColumn(cCheap).width=20;ws.getColumn(cSel).width=20;
}
A.xlsx=async(rid,btn)=>{
  const r=R(rid);if(!DL)return toast('Saving files is not available in this view. Open the page in a browser on a computer.');

  catch(e){toast(e?.code==='declined'?'Download cancelled':e?.code==='lib'?'Could not load the Excel maker. Check the internet connection.':'Could not save the file. Please try again.')}

A.delQuote=(rid,k,qid)=>{const r=R(rid),cat=catsOf(r)[k];r.quotes[cat]=r.quotes[cat].filter(q=>q.id!==qid);log('Removed a quote for '+cat,r.no);render()};
A.copy=()=>{navigator.clipboard?.writeText(tmp.sheet).then(()=>toast('Copied'),()=>{const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(document.getElementById('sh'));s.removeAllRanges();s.addRange(rg);toast('Text selected. Press copy.')})};
/* Request for quotation, laid out like a Tally proforma invoice */
const coInfo=n=>(S.companyInfo||{})[n]||{};
function rfqData(r,cat,vendor){const s=site(r.site),co=r.company||s.companies[0];
  return {r,cat,s,co,coAddr:coInfo(co).address||'Address to be added in Settings',coGstin:coInfo(co).gstin||'To be added',siteAddr:s.address||'Address to be added in Settings',vendor,
    items:r.items.filter(i=>i.cat===cat),date:new Date()}}
function rfqDesc(it){return [it.brand?`Brand: ${it.brand} or equivalent`:'',it.subUnit?`Packing: ${it.subUnit}`:'',it.spec||''].filter(Boolean).join('\n')}
const RFQ_TERMS=['Please quote your rate per unit before GST, and mention the GST % for each item.','Rates should include delivery to the site address above. Mention freight or loading charges separately if any.','Mention delivery time and how long your quote is valid.','Quote the brand you are offering if different from the one asked.','Please reply on WhatsApp or email with this sheet filled in, or your own proforma invoice.'];
function rfqHtml(d){
  return `<div class="rfq"><div class="rfq-t">REQUEST FOR QUOTATION</div>

async function pdfMaker(){if(window.jspdf?.jsPDF&&window.jspdf.jsPDF.API.autoTable)return window.jspdf.jsPDF;await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');return window.jspdf.jsPDF}
function rfqPdf(J,d){
  const doc=new J({unit:'mm',format:'a4'}),L=10,W=190,R=L+W,M=L+W/2,ink=[24,32,28],mute=[104,115,109],line=[120,128,124];
  doc.setDrawColor(...line);doc.setLineWidth(.25);doc.setTextColor(...ink);
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('REQUEST FOR QUOTATION',105,15,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...mute);doc.text('Kailasha Group · please fill in rates and return, or send your proforma invoice',105,19.5,{align:'center'});
  const top=22;
  const block=(x,y,w,label,bold,lines)=>{doc.setFontSize(7.5);doc.setTextColor(...mute);doc.setFont('helvetica','normal');doc.text(label,x+2,y+4);doc.setTextColor(...ink);doc.setFont('helvetica','bold');doc.setFontSize(9.5);let yy=y+8.5;doc.splitTextToSize(bold,w-4).forEach(t2=>{doc.text(t2,x+2,yy);yy+=4});doc.setFont('helvetica','normal');doc.setFontSize(8);lines.filter(Boolean).forEach(l=>doc.splitTextToSize(l,w-4).forEach(t2=>{doc.text(t2,x+2,yy);yy+=3.6}))};
  const h1=34,h2=30;
  doc.rect(L,top,W,h1+h2);doc.line(M,top,M,top+h1+h2);doc.line(L,top+h1,R,top+h1);
  block(L,top,W/2,'Buyer (Bill to)',d.co,[d.coAddr,'GSTIN/UIN: '+d.coGstin,'State Name: West Bengal, Code: 19']);
  // right key cells 2x2 + 1 row
  const cw=W/4,ch=h1/3;const cell=(cx,cy,w,label,val)=>{doc.rect(cx,cy,w,ch);doc.setFontSize(7.5);doc.setTextColor(...mute);doc.text(label,cx+2,cy+3.8);doc.setTextColor(...ink);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text(doc.splitTextToSize(val,w-4)[0]||'',cx+2,cy+8.3);doc.setFont('helvetica','normal')};
  cell(M,top,cw,'Ref. No.',d.r.no);cell(M+cw,top,cw,'Dated',fmtD(d.date));
  cell(M,top+ch,cw,'Needed by',fmtD(d.r.deadline));cell(M+cw,top+ch,cw,'Category',d.cat);
  cell(M,top+2*ch,cw,'Mode/Terms of Payment','');cell(M+cw,top+2*ch,cw,'Quote valid till','');
  block(L,top+h1,W/2,'Consignee (Ship to)',d.s.name,[d.siteAddr,'State Name: West Bengal, Code: 19']);
  block(M,top+h1,W/2,'Supplier',d.vendor?d.vendor.name:'',d.vendor?[d.vendor.city,'GSTIN/UIN: '+(d.vendor.gstin||''),'Ph: '+(d.vendor.phone||'')]:[]);
  const body=d.items.map((it,i)=>[String(i+1),{content:it.name+(rfqDesc(it)?'\n'+rfqDesc(it):''),styles:{}},'',nf(it.qty)+' '+it.unit,'',it.unit,'']);
  body.push(['',{content:'Freight / loading, if any',styles:{fontStyle:'italic'}},'','','','','']);
  const blanks=Math.max(0,8-body.length);for(let i=0;i<blanks;i++)body.push(['','','','','','','']);
  doc.autoTable({startY:top+h1+h2,margin:{left:L,right:L},theme:'grid',
    head:[['Sl\nNo','Description of Goods','GST %','Quantity','Rate','per','Amount']],
    body,foot:[['',{content:'Total',styles:{halign:'right'}},'','','','','']],
    styles:{font:'helvetica',fontSize:8.5,textColor:ink,lineColor:line,lineWidth:.25,cellPadding:1.8,valign:'top',minCellHeight:9},
    headStyles:{fillColor:[255,255,255],textColor:ink,fontStyle:'bold',halign:'center',valign:'middle',minCellHeight:8},
    footStyles:{fillColor:[255,255,255],textColor:ink,fontStyle:'bold',minCellHeight:8},
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:'auto'},2:{cellWidth:13},3:{cellWidth:26,halign:'right'},4:{cellWidth:20,halign:'right'},5:{cellWidth:13},6:{cellWidth:24,halign:'right'}},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===1&&h.cell.raw&&h.cell.raw.content){}}});
  let y=doc.lastAutoTable.finalY;
  doc.rect(L,y,W,10);doc.setFontSize(7.5);doc.setTextColor(...mute);doc.text('Amount Chargeable (in words)',L+2,y+4);y+=10;
  const th=44;doc.rect(L,y,W,th);doc.line(L+W*0.62,y,L+W*0.62,y+th);
  doc.setTextColor(...mute);doc.text('Terms',L+2,y+4);doc.setTextColor(...ink);doc.setFontSize(7.8);let yy=y+8;
  RFQ_TERMS.forEach((t2,i)=>doc.splitTextToSize(`${i+1}. ${t2}`,W*0.62-5).forEach(l=>{doc.text(l,L+2,yy);yy+=3.5}));
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('for KAILASHA GROUP',R-2,y+5,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text('Authorised Signatory',R-2,y+th-3,{align:'right'});
  y+=th;doc.rect(L,y,W,16);doc.setFontSize(7.5);doc.setTextColor(...mute);doc.text("Supplier's seal and signature",L+2,y+4);doc.text('Date',L+W*0.62+2,y+4);
  doc.setFontSize(7);doc.text('This is a computer generated document.',105,y+21,{align:'center'});
  return doc}

async function zipLib(){if(window.JSZip)return window.JSZip;await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');return window.JSZip}
A.rfqPdf=async(rid,k,btn)=>{const r=R(rid),cat=catsOf(r)[k],vs=(tmp.sv||[]).map(V).filter(Boolean);
  if(!DL)return toast('Saving files is not available in this view. Open the page in a browser on a computer.');
  const old=btn.textContent;btn.disabled=true;btn.textContent='Preparing…';
  const base=`RFQ ${r.no.replace(/\//g,'-')} ${cat.replace(/[^\w ]+/g,'')}`,fn=v=>`${base}${v?' - '+v.name.replace(/[^\w ]+/g,''):''}.pdf`;
  try{const J=await pdfMaker();
    if(vs.length<=1){const v=vs[0]||null;await DL.save({filename:fn(v),data:rfqPdf(J,rfqData(r,cat,v)).output('arraybuffer')})}
    else{const Z=await zipLib(),z=new Z();vs.forEach(v=>z.file(fn(v),rfqPdf(J,rfqData(r,cat,v)).output('arraybuffer')));await DL.save({filename:base+` (${vs.length} vendors).zip`,data:await z.generateAsync({type:'arraybuffer'})})}
    log(`Downloaded quotation request PDF for ${cat}${vs.length?' ('+vs.map(v=>v.name).join(', ')+')':''}`,r.no);save();toast(vs.length>1?`${vs.length} PDFs saved in one zip file`:'PDF saved')}
  catch(e){toast(e?.code==='declined'?'Download cancelled':e?.code==='lib'?'Could not load the PDF maker. Check the internet connection.':'Could not save the PDF. Please try again.')}

A.receipt=id=>{const p=P(id);modal(`<h2>Record material received</h2><p class="small muted">${p.no} · ${esc(V(p.vendorId).name)}</p>
  ${p.lines.map((l,i)=>`<label>${esc(l.name)} · ${nf(l.qty-l.received)} ${esc(l.unit)} pending<input id="rc_${i}" type="number" inputmode="decimal" step="any" min="0" max="${l.qty-l.received}" value="${l.qty-l.received}"></label>`).join('')}

A.doReceipt=id=>{const p=P(id),got=p.lines.map((l,i)=>+val('rc_'+i)||0);
  if(got.some((x,i)=>x<0||x>p.lines[i].qty-p.lines[i].received+1e-9)){document.getElementById('rc_err').textContent='Received quantity cannot be more than what is pending.';return}

  const ch=val('rc_ch').trim();
  got.forEach((x,i)=>{if(!x)return;const l=p.lines[i];l.received+=x;stockAdd(p.site,l.name,l.unit,x,'Received',S.me,'Against '+p.no,p.cat)});
  p.receipts.push({at:now(),by:S.me,challan:ch,lines:got});
  const txt=got.map((x,i)=>x?`${nf(x)} ${p.lines[i].unit} ${p.lines[i].name}`:'').filter(Boolean).join(', ');
  S.tally.unshift({id:uid(),at:now(),po:p.no,vendor:V(p.vendorId).name,text:'Receipt '+txt,status:'Waiting for Tally connector'});
  log(`Recorded receipt of ${txt}${ch?' (challan '+ch+')':''}`,p.no);
  if(p.lines.every(l=>l.received>=l.qty))p.status='done';
  A.close();render();toast(p.status==='done'?'All material received. PO complete.':'Receipt saved. PO stays open for the rest.')};
A.qtyAsk=id=>{const p=P(id);modal(`<h2>Request quantity change</h2><p class="small muted">Goes straight to the procurement manager. Up to 10% they can approve alone. More than 10% also needs ${p.site==='KAL'?'Ravi':'Ajay'}.</p>

  <label>New quantity<input id="qc_q" type="number" inputmode="decimal" step="any"></label><label>Reason<textarea id="qc_r"></textarea></label><p class="err" id="qc_err"></p>
  <div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" onclick="A.doQty('${id}')">Send request</button></div>`)};
A.doQty=id=>{const p=P(id),i=+val('qc_l'),to=+val('qc_q'),l=p.lines[i],why=val('qc_r').trim();
  if(!(to>0)||to===l.qty){document.getElementById('qc_err').textContent='Enter a new quantity different from the current one.';return}
  if(to<l.received){document.getElementById('qc_err').textContent=`Already received ${nf(l.received)}. The new quantity cannot be lower.`;return}
  if(!why){document.getElementById('qc_err').textContent='Give a short reason.';return}
  const pct=Math.round((to-l.qty)/l.qty*1000)/10;
  S.qty.push({id:uid(),poId:id,line:i,from:l.qty,to,pct,reason:why,by:S.me,at:now(),status:'pm',trio:site(p.site).type==='mfg'?'ravi':'ajay'});
  log(`Asked to change ${l.name} from ${nf(l.qty)} to ${nf(to)} (${pct}%)`,p.no);send(targets('pm'),`${p.no}: quantity change request for ${l.name}, ${nf(l.qty)} to ${nf(to)} (${pct}%).`,'Quantity change');A.close();render();toast('Sent to procurement manager')};

A.label=id=>{const s=S.stock.find(x=>x.id===id);modal(`<h2>Barcode label</h2><div class="labelcard"><b>${esc(s.name)}</b><svg id="bc"></svg><span class="small muted">${esc(site(s.site).name)}</span></div><p class="hint">The full version prints these on a label printer or an A4 sticker sheet.</p><div class="mact"><button class="btn" onclick="A.close()">Done</button></div>`);
  try{JsBarcode('#bc',s.barcode,{height:50,fontSize:14,margin:4,lineColor:'#18201c'})}catch(e){document.getElementById('bc').outerHTML=`<span class="mono">${s.barcode}</span>`}};
A.stockNew=()=>modal(`<h2>Add stock item</h2><div class="grid"><label class="span2">Item name<input id="sn_n"></label><label>Unit<select id="sn_u">${S.units.map(u=>`<option>${esc(u)}</option>`).join('')}</select></label><label>Opening quantity<input id="sn_q" type="number" inputmode="decimal" step="any" value="0"></label></div><div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" onclick="A.doStockNew()">Add</button></div>`);
A.doStockNew=()=>{const n=val('sn_n').trim();if(!n)return toast('Add a name');const s=stockAdd(me().site,n,val('sn_u'),+val('sn_q')||0,'Opening stock',S.me,'Opening balance',guessCat(n,me().site)?.cat||'');log('Added stock item '+n,s.barcode);A.close();render();toast('Added with barcode '+s.barcode)};

/* vendors */
A.vendorNew=()=>modal(`<h2>Add vendor</h2><div class="grid"><label class="span2">Business name<input id="vn_n"></label><label>Contact person<input id="vn_c"></label><label>WhatsApp number<input id="vn_p" inputmode="tel"></label><label>Email (optional)<input id="vn_e" inputmode="email"></label><label>City<input id="vn_city"></label><label class="span2">GSTIN<input id="vn_g" maxlength="15" placeholder="15 characters, e.g. 19ABCDE1234F1Z5" style="text-transform:uppercase"></label><label class="span2">Supplies (categories)<input id="vn_cat" placeholder="e.g. Electrical, Plumbing and sanitary"></label></div><p class="err" id="vn_err"></p><div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" onclick="A.doVendor()">Save vendor</button></div>`);
A.doVendor=()=>{const n=val('vn_n').trim(),g=val('vn_g').trim().toUpperCase();
  if(!n){document.getElementById('vn_err').textContent='Add the business name.';return}
  if(g&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)){document.getElementById('vn_err').textContent='That GSTIN does not look right. It should be 15 characters, like 19ABCDE1234F1Z5.';return}
  S.vendors.push({id:uid(),name:n,contact:val('vn_c').trim(),phone:val('vn_p').trim(),email:val('vn_e').trim(),gstin:g,city:val('vn_city').trim(),cats:val('vn_cat').trim()});log('Added vendor '+n);A.close();render();toast('Vendor added')};

/* settings */
A.siteAddr=el=>{site(el.dataset.s).address=el.value.trim();log('Updated site address for '+site(el.dataset.s).name);save();toast('Saved')};
A.coField=(el,f)=>{const c=el.dataset.c,co=S._cos.find(x=>x.name===c);if(!co)return;const v=f==='gstin'?el.value.trim().toUpperCase():el.value.trim();if(f==='gstin'&&v&&!/^[0-9A-Z]{15}$/.test(v))return toast('A GSTIN has 15 letters and digits');co[f]=v;Live.rebuildCompanies();log(`Updated ${f==='gstin'?'GSTIN':'address'} of ${c}`);save();toast('Saved')};
A.coAdd=el=>{const sc=el.dataset.s;modal(`<h2>Add billing company</h2><p class="small muted">${esc(site(sc).name)}</p><label>Company name<input id="co_n"></label><label>GSTIN<input id="co_g" maxlength="15" style="text-transform:uppercase"></label><label>Company address<input id="co_a"></label><div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" onclick="A.doCoAdd('${sc}')">Add</button></div>`)};
A.doCoAdd=sc=>{const n=val('co_n').trim(),g=val('co_g').trim().toUpperCase();if(!n)return toast('Add the company name');if(g&&!/^[0-9A-Z]{15}$/.test(g))return toast('A GSTIN has 15 letters and digits');
  const ex=S._cos.find(x=>x.name.toLowerCase()===n.toLowerCase());if(ex){if(!ex.sites.includes(sc))ex.sites.push(sc)}else S._cos.push({id:uid(),name:n,gstin:g,address:val('co_a').trim(),sites:[sc]});
  Live.rebuildCompanies();log(`Added billing company ${n} for ${site(sc).name}`);A.close();render();toast('Company added')};
A.coName=el=>{const st=site(el.dataset.s),i=+el.dataset.i,old=st.companies[i],n=el.value.trim();if(!n||n===old)return;const co=S._cos.find(x=>x.name===old);if(co)co.name=n;Live.rebuildCompanies();S.pos.forEach(p=>{if(p.company===old)p.company=n});S.reqs.forEach(r=>{if(r.company===old)r.company=n});log(`Renamed billing company to ${n}`);render();toast('Saved')};
A.deleg=()=>{const to=val('dg_to'),until=new Date(val('dg_until')+'T23:59').getTime();if(!(until>now()))return toast('Choose a date from today onwards');S.deleg[S.me]={to,until};log(`Handed approvals to ${uname(to)} until ${fmtD(until)}`);send([to],`${uname(S.me)} has handed you their approvals until ${fmtD(until)}.`,'Hand-over');render();toast('Approvals handed to '+uname(to))};
A.delegOff=()=>{delete S.deleg[S.me];log('Took approvals back');render();toast('Approvals are back with you')};
A.areaOk=b=>{const sc=b.dataset.s,n=b.dataset.n;(S.areas[sc]=S.areas[sc]||[]).push(n);log(`Approved quick-pick area "${n}" for ${site(sc).name}`);render();toast('Added as a quick pick')};
A.areaNo=b=>{S.areaDismissed.push(b.dataset.s+'|'+b.dataset.n);render()};
A.catDel=b=>{const k=b.dataset.k,c=b.dataset.c;S.cats[k]=S.cats[k].filter(x=>x!==c);log('Removed category '+c);render()};
A.catAdd=k=>{const c=val('nc_'+k).trim();if(!c)return;if(!S.cats[k].includes(c))S.cats[k].push(c);log('Added category '+c);render();toast('Category added')};
A.userNew=()=>modal(`<h2>Add person</h2><div class="grid"><label class="span2">Name<input id="un_n"></label><label>Mobile number<input id="un_m" inputmode="numeric" maxlength="10"></label><label>Role<select id="un_r" onchange="document.getElementById('un_sw').hidden=this.value!=='store'"><option value="store">Storekeeper</option><option value="pm">Procurement manager</option><option value="ajay">Approver: Ajay Agarwal</option><option value="ravi">Approver: Ravi Mittal</option></select></label><label id="un_sw">Site<select id="un_s">${S.sites.map(s=>`<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select></label><label class="span2">Starting password<input id="un_p" placeholder="At least 6 characters"></label></div><p class="hint">Tell them this password. They log in with their mobile number and can change it under My account.</p><p class="err" id="un_err"></p><div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" id="un_go" onclick="A.doUser()">Add</button></div>`);
A.doUser=async()=>{const n=val('un_n').trim(),m=val('un_m').replace(/\D/g,''),r=val('un_r'),p=val('un_p'),er=document.getElementById('un_err');
  if(!n||m.length!==10){er.textContent='Add a name and a 10-digit mobile number.';return}if(p.length<6){er.textContent='The starting password needs at least 6 characters.';return}
  document.getElementById('un_go').disabled=true;
  const {error}=await SB.rpc('add_person',{p_name:n,p_mobile:m,p_role:r,p_site:r==='store'?val('un_s'):null,p_password:p});
  if(error){er.textContent=Live.errText(error);document.getElementById('un_go').disabled=false;return}
  log('Added person '+n);A.close();await Live.reload();toast(n+' can now log in with '+m)};
A.pwReset=id=>{const x=S.users.find(u=>u.uuid===id);modal(`<h2>New password for ${esc(x.name)}</h2><label>New password<input id="pr_p" placeholder="At least 6 characters"></label><p class="hint">Tell them the new password. They can change it under My account.</p><p class="err" id="pr_err"></p><div class="mact"><button class="btn" onclick="A.close()">Cancel</button><button class="btn primary" onclick="A.doPwReset('${id}')">Save</button></div>`)};
A.doPwReset=async id=>{const p=val('pr_p');if(p.length<6){document.getElementById('pr_err').textContent='At least 6 characters.';return}
  const {error}=await SB.rpc('set_person_password',{p_person:id,p_password:p});if(error){document.getElementById('pr_err').textContent=Live.errText(error);return}
  log('Set a new password for '+S.users.find(u=>u.uuid===id).name);save();A.close();toast('Password changed')};
A.userActive=async(id,on)=>{const {error}=await SB.rpc('app_update',{p_table:'people',p_key:{id},p_set:{active:on}});if(error)return toast(Live.errText(error));log(`${on?'Switched on':'Switched off'} login for ${S.users.find(u=>u.uuid===id).name}`);await Live.reload();toast(on?'Login switched on':'Login switched off')};

/* My account: password and reject PIN */
A.account=()=>{const u=me(),appr=['ajay','ravi','raunak','admin'].includes(u.dbRole);modal(`<h2>My account</h2><p class="small muted">${esc(u.name)} · ${esc(u.mobile)}</p>
  <div class="sec" style="gap:8px"><h3>Change password</h3><label>New password<input id="ac_p" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label><label>Type it again<input id="ac_p2" type="password" autocomplete="new-password"></label><div class="actions"><button class="btn primary sm" onclick="A.doPw()">Change password</button></div></div>
  ${appr?`<div class="sec" style="gap:8px"><h3>Reject PIN</h3><p class="small muted">4 digits, asked every time you reject a requisition. If you set one before, enter the old PIN too.</p><div class="grid"><label>Old PIN (if any)<input id="ac_o" type="password" inputmode="numeric" maxlength="4"></label><label>New PIN<input id="ac_n" type="password" inputmode="numeric" maxlength="4"></label></div><div class="actions"><button class="btn sm" onclick="A.doPin()">Save PIN</button></div></div>`:''}
  <p class="err" id="ac_err"></p><div class="mact"><button class="btn" onclick="A.close()">Close</button></div>`)};
A.doPw=async()=>{const p=val('ac_p'),e=document.getElementById('ac_err');if(p.length<6){e.textContent='The password needs at least 6 characters.';return}if(p!==val('ac_p2')){e.textContent='The two passwords are not the same.';return}
  const {error}=await SB.auth.updateUser({password:p});if(error){e.textContent=Live.errText(error);return}A.close();toast('Password changed')};
A.doPin=async()=>{const n=val('ac_n'),o=val('ac_o'),e=document.getElementById('ac_err');if(!/^\d{4}$/.test(n)){e.textContent='The PIN must be 4 digits.';return}
  const {error}=await SB.rpc('set_my_pin',{p_new:n,p_old:o||null});if(error){e.textContent=/Old PIN/.test(error.message)?'The old PIN is wrong.':Live.errText(error);return}A.close();toast('PIN saved')};

window.addEventListener('keydown',e=>{if(e.key==='Escape')A.close()});
</script>
<script src="live.js"></script>
<script>Live.boot()</script>
</body>
</html>
